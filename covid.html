<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andamento COVID-19 in Italia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .pagina {
            max-width: 1400px;
            margin: auto;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 30px;
            margin-top: 15px;
        }

        header p {
            color: #dbeafe;
            line-height: 1.5;
        }

        .tabella {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
        }

        h2 {
            font-size: 20px;
            color: #0f172a;
        }

        .fonte {
            font-size: 12px;
            color: #64748b;
        }

        #dati {
            overflow: auto;
            max-height: 70vh;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            white-space: nowrap;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #1e40af;
            color: white;
            position: sticky;
            top: 0;
        }

        tbody tr:nth-child(even) {
            background-color: #f1f5f9;
        }

        tbody tr:hover {
            background-color: #dbeafe;
        }

        .errore {
            color: red;
            padding: 20px;
        }

        .caricamento {
            padding: 20px;
            text-align: center;
            color: gray;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            header {
                padding: 20px;
            }

            h1 {
                font-size: 23px;
            }

            .tabella {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <header>
            <h1>Andamento COVID-19 in Italia</h1>
            <p>
                In questa pagina è possibile vedere i dati
                relativi all'andamento del COVID-19 in Italia.
            </p>
        </header>

        <main class="tabella">

            <h2>Dati nazionali</h2>
            <p class="fonte">Fonte: Protezione Civile</p>

            <div id="dati" class="caricamento">
                Caricamento dei dati...
            </div>

        </main>

        <footer>
            Dati presi dal sito pubblico della Protezione Civile.
        </footer>

    </div>

    <script>

        var url = "https://raw.githubusercontent.com/pcm-dpc/COVID-19/master/dati-json/dpc-covid19-ita-andamento-nazionale.json";

        var richiesta = new XMLHttpRequest();

        richiesta.open("GET", url, true);

        richiesta.onreadystatechange = function() {

            if (richiesta.readyState == 4) {

                var contenitore = document.getElementById("dati");

                if (richiesta.status == 200) {

                    try {

                        var dati = JSON.parse(richiesta.responseText);

                        if (dati.length == 0) {

                            return;

                        var intestazione = document.createElement("thead");
                        var corpo = document.createElement("tbody");

                        var riga = document.createElement("tr");

                        for (var i = 0; i < chiavi.length; i++) {

                            var colonna = document.createElement("th");

                            colonna.textContent = chiavi[i];

                            riga.appendChild(colonna);
                        }

                        intestazione.appendChild(riga);
                        tabella.appendChild(intestazione);

                        for (var i = 0; i < dati.length; i++) {

                            var rigaDati = document.createElement("tr");

                            for (var j = 0; j < chiavi.length; j++) {

                                var cella = document.createElement("td");

                                var nome = chiavi[j];
                                var valore = dati[i][nome];

                                if (valore != null) {
                                    cella.textContent = valore;
                                } else {
                                    cella.textContent = "";
                                }

                                rigaDati.appendChild(cella);
                            }

                            corpo.appendChild(rigaDati);
                        }

                        tabella.appendChild(corpo);

                        contenitore.className = "";
                        contenitore.textContent = "";
                        contenitore.appendChild(tabella);

                    } catch (errore) {

                        contenitore.textContent = "Errore nella lettura dei dati.";
                        contenitore.className = "errore";
                    }

                } else {

                    contenitore.textContent = "Errore nel caricamento: " + richiesta.status;
                    contenitore.className = "errore";
                }
            }
        };

        richiesta.onerror = function() {

            var contenitore = document.getElementById("dati");

            contenitore.textContent = "Errore di connessione.";
            contenitore.className = "errore";
        };

        richiesta.send();

    </script>

</body>
</html>
